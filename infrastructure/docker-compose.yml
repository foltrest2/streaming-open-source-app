services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # Keycloak
  keycloak:                                  
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: 
      - start-dev
      - --features=preview
      - --import-realm
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_SPI_THEME_CACHE_ENABLED: "false"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: "preview"
    ports:
      - "8082:8080"
    depends_on:
      - postgres-keycloak
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export:/opt/keycloak/data/import


  # PostgreSQL Keycloak
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    env_file: .env
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    ports:
      - "5431:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: always

  # PostgreSQL Users
  postgres-users:
    image: postgres:16-alpine
    container_name: postgres-users
    env_file: .env
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./db/users/init.sql:/docker-entrypoint-initdb.d/init.sql
      - users_data:/var/lib/postgresql/data

  # PostgreSQL Catalog
  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    env_file: .env
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - ./db/catalog/init.sql:/docker-entrypoint-initdb.d/init.sql
      - catalog_data:/var/lib/postgresql/data

  # PostgreSQL Billing
  postgres-billing:
    image: postgres:16-alpine
    container_name: postgres-billing
    env_file: .env
    environment:
      POSTGRES_USER: ${BILLING_DB_USER}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
      POSTGRES_DB: ${BILLING_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - ./db/billing/init.sql:/docker-entrypoint-initdb.d/init.sql
      - billing_data:/var/lib/postgresql/data

  # PostgreSQL Recommendation
  postgres-recommendation:
    image: postgres:16-alpine
    container_name: postgres-recommendation
    env_file: .env
    environment:
      POSTGRES_USER: ${RECOMMENDATION_DB_USER}
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD}
      POSTGRES_DB: ${RECOMMENDATION_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - ./db/recommendation/init.sql:/docker-entrypoint-initdb.d/init.sql
      - recommendation_data:/var/lib/postgresql/data

  # Users Service (Java)
  users:
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    container_name: users
    env_file: .env
    environment:
      DB_HOST: postgres-users
      DB_PORT: 5432
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_NAME: ${USERS_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "5000:8080"
    depends_on:
      - postgres-users
      - redis
      - keycloak

  # Catalog Service (Node.js)
  catalog:
    build:
      context: ../backend/catalog-service
      dockerfile: Dockerfile
    container_name: catalog
    env_file: .env
    environment:
      DB_HOST: postgres-catalog
      DB_PORT: 5432
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      DB_NAME: ${CATALOG_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4000:4000"
    depends_on:
      - postgres-catalog
      - redis
      - keycloak

  # Streaming Service (Go)
  streaming:
    build:
      context: ../backend/streaming-service
      dockerfile: Dockerfile
    container_name: streaming
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "6000:8080"
    depends_on:
      - redis
      - keycloak

# Recommendation Service (Python)
  recommendation:
    build:
      context: ../backend/recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres-recommendation
      DB_PORT: 5432
      DB_USER: ${RECOMMENDATION_DB_USER}
      DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD}
      DB_NAME: ${RECOMMENDATION_DB_NAME}
    ports:
      - "5005:5005"
    depends_on:
      - redis
      - postgres-recommendation

  # Billing Service (Java)
  billing:
    build:
      context: ../backend/billing-service
      dockerfile: Dockerfile
    container_name: billing
    env_file: .env
    environment:
      DB_HOST: postgres-billing
      DB_PORT: 5432
      DB_USER: ${BILLING_DB_USER}
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
      DB_NAME: ${BILLING_DB_NAME}
      KEYCLOAK_URL: http://keycloak:8080
      # SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8081:8080"
    depends_on:
      - postgres-billing
      - keycloak

# Frontend
  frontend:
    build:
      context: ../frontend/StreamingApp.Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - users
      - catalog
      - streaming
      - billing
      - gateway

  # Gateway (Node.js)
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: gateway
    env_file: .env
    environment:
      USERS_URL: http://users:5000
      CATALOG_URL: http://catalog:4000
      STREAMING_URL: http://streaming:8080
      BILLING_URL: http://billing:8081
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8080:8080"
    #  - "9228:9229"
    #command: node --inspect=0.0.0.0:9229 server.js
    depends_on:
      - users
      - catalog
      - streaming
      - billing
      - keycloak

volumes:
  users_data:
  catalog_data:
  billing_data:
  recommendation_data:
  keycloak-db-data: